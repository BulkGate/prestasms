name: Run application tests

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
    paths-ignore:
      - '.docker/**'
      - '.github/**'
      - 'README.md'
      - '!.github/workflows/tests.yml'

jobs:
  tests:
    runs-on: ubuntu-latest

    # minimum and maximum supported version
    strategy:
      matrix:
        include:
          - php: 7.4
            prestashop: 1.7.8.0
          - php: 7.4
            prestashop: 8.2.1
          - php: 8.1
            prestashop: 8.2.1
          - php: 8.4
            prestashop: 9.0.0-1.0-classic

    container: ghcr.io/bulkgate/prestasms:${{ matrix.prestashop }}-${{ matrix.php }}

    steps:
      - uses: actions/checkout@v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Run test suite
        run: composer run tester

      - name: Run static analysis
        shell: bash
        run: |
          if [[ "${{ matrix.prestashop }}" == 1.7.* ]]; then
            composer run phpstan -- -c phpstan7.neon
          elif [[ "${{ matrix.prestashop }}" == 8.* ]]; then
            composer run phpstan -- -c phpstan8.neon
          elif [[ "${{ matrix.prestashop }}" == 9.* ]]; then
            composer run phpstan -- -c phpstan9.neon
          else
            composer run phpstan
          fi

  coverage:
    runs-on: ubuntu-latest

    container: ghcr.io/bulkgate/prestasms:9.0.0-1.0-classic-8.4

    steps:
      - uses: actions/checkout@v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Run coverage
        run: composer run coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html